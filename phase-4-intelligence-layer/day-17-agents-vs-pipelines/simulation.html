<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Day 17 — Agents vs Pipelines</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03050e;--panel:#060a16;--border:#0c1428;
  --pipe:#4d9fff;--agent:#f59e0b;--tool:#a855f7;
  --good:#22c55e;--bad:#ef4444;--llm:#f472b6;
  --txt:#94a3b8;--dim:#1e3a5f;
}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(77,159,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,.012) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;padding:24px 20px 60px;max-width:1200px;margin:0 auto}

header{text-align:center;margin-bottom:28px}
.badge{font-size:.62rem;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
h1{font-size:1.4rem;font-weight:700;color:#e2e8f0;margin-bottom:4px}
h1 .p{color:var(--pipe)} h1 .a{color:var(--agent)}
.sub{font-size:.75rem;color:var(--dim);letter-spacing:.06em}

.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:6px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--dim);transition:all .2s}
.tab:hover{color:#4a7aaa;border-color:var(--dim)}
.tab.t-pipe.on{color:var(--pipe);border-color:var(--pipe);box-shadow:0 0 14px rgba(77,159,255,.25)}
.tab.t-agent.on{color:var(--agent);border-color:var(--agent);box-shadow:0 0 14px rgba(245,158,11,.25)}
.tab.t-compare.on{color:var(--good);border-color:var(--good);box-shadow:0 0 14px rgba(34,197,94,.25)}

.board{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden;min-height:520px}
.board::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--agent),transparent);opacity:.2}
.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(245,158,11,.07),transparent);animation:sc 7s linear infinite;pointer-events:none}
@keyframes sc{0%{top:0}100%{top:100%}}

.view{display:none}.view.on{display:block}

/* PIPELINE FLOW */
.flow-col{display:flex;flex-direction:column;align-items:center;gap:0}
.step-node{width:320px;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:#040810;text-align:center;opacity:.35;transform:translateY(5px);transition:all .3s}
.step-node.in{opacity:1;transform:translateY(0)}
.step-node.lit-pipe{border-color:var(--pipe);box-shadow:0 0 16px rgba(77,159,255,.2)}
.step-node.lit-agent{border-color:var(--agent);box-shadow:0 0 16px rgba(245,158,11,.2)}
.sn-num{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.sn-name{font-size:.82rem;font-weight:600;color:#c8d0e8;margin-bottom:2px}
.sn-detail{font-size:.65rem;color:#3a5a7a}
.step-arrow{width:2px;height:20px;background:linear-gradient(to bottom,#1e3a5f,#2a4a7a);position:relative}
.step-arrow::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid #2a4a7a}
.step-arrow.lit-pipe{background:var(--pipe)}.step-arrow.lit-pipe::after{border-top-color:var(--pipe)}
.step-arrow.lit-agent{background:var(--agent)}.step-arrow.lit-agent::after{border-top-color:var(--agent)}

/* AGENT STEPS */
.agent-steps{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.agent-step{border-radius:8px;border:1px solid var(--border);background:#040810;padding:10px 14px;opacity:.35;transform:translateX(-6px);transition:all .35s}
.agent-step.in{opacity:1;transform:translateX(0)}
.as-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.as-num{font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--agent)}
.as-tool{font-size:.72rem;font-weight:600;color:#c8d0e8}
.as-reason{font-size:.65rem;color:#3a5a7a;font-style:italic}
.as-result{font-size:.65rem;font-family:monospace;color:var(--good);margin-top:3px}
.as-discovery{font-size:.65rem;color:var(--agent);font-weight:600;margin-top:3px}

/* RESULT BOXES */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:700px){.result-grid{grid-template-columns:1fr}}
.rbox{border-radius:10px;border:1px solid var(--border);background:#040810;overflow:hidden}
.rbox-header{padding:9px 14px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.rbox-header.pipe{background:rgba(77,159,255,.07);color:var(--pipe);border-bottom:1px solid rgba(77,159,255,.12)}
.rbox-header.agent{background:rgba(245,158,11,.07);color:var(--agent);border-bottom:1px solid rgba(245,158,11,.12)}
.rbox-body{padding:12px 14px;font-size:.7rem;line-height:1.7}
.rbox-body.pipe-t{color:#3a5a7a}.rbox-body.agent-t{color:#7a6a3a}

/* COMPARE TABLE */
.cmp-table{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:14px}
.cmp-table th{padding:9px 12px;text-align:left;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);color:var(--dim)}
.cmp-table td{padding:9px 12px;border-bottom:1px solid #080e18;vertical-align:top}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table td:first-child{color:var(--dim);font-weight:600;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pc{color:var(--pipe)}.ac{color:var(--agent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">Phase 4 · Day 17</div>
    <h1><span class="p">Pipeline</span> vs <span class="a">Agent</span></h1>
    <p class="sub">Deterministic workflows vs adaptive tool orchestration</p>
  </header>

  <div class="tabs">
    <button class="tab t-pipe"    onclick="show('pipe')">🔄 Pipeline</button>
    <button class="tab t-agent"   onclick="show('agent')">🤖 Agent</button>
    <button class="tab t-compare" onclick="show('compare')">⚡ Compare</button>
  </div>

  <div class="board" id="board">
    <div class="scan"></div>
    <div class="view" id="view-pipe"></div>
    <div class="view" id="view-agent"></div>
    <div class="view" id="view-compare"></div>
  </div>
</div>

<script>
// ── PIPELINE VIEW ──────────────────────────────────────────────────────────
const PIPE_STEPS = [
  {num:'Step 1', name:'Parse Query',     detail:'intent=churn, user_id=u_4821'},
  {num:'Step 2', name:'Query Pinot',     detail:'SELECT metrics WHERE user_id=u_4821 (always)'},
  {num:'Step 3', name:'Search Vectors',  detail:'embed("churn u_4821") → top-3 (always)'},
  {num:'Step 4', name:'Filter Context',  detail:'select top-3 most relevant chunks'},
  {num:'Step 5', name:'Call LLM',        detail:'structured + semantic → response'},
];

function buildPipeline() {
  const c = document.getElementById('view-pipe');
  c.innerHTML = `
    <div style="font-size:.68rem;color:var(--dim);margin-bottom:14px">
      Task: "Why did user u_4821 churn?" — Pipeline always takes the same 5 steps.
    </div>
    <div class="flow-col" id="pipe-flow"></div>
    <div class="result-grid" style="margin-top:16px">
      <div class="rbox">
        <div class="rbox-header pipe">🔄 Pipeline Response</div>
        <div class="rbox-body pipe-t">
          <b>Summary:</b> User u_4821 is at HIGH churn risk due to checkout errors.<br>
          <b>Action:</b> trigger_retention_workflow<br>
          <b>Confidence:</b> 87%<br><br>
          <span style="color:var(--bad);font-size:.65rem">❌ Missed: payment gateway was down for 23 users. This is systemic, not user-specific.</span>
        </div>
      </div>
      <div class="rbox">
        <div class="rbox-header pipe" style="color:#94a3b8">📊 Pipeline Properties</div>
        <div class="rbox-body pipe-t">
          <b>Steps:</b> Always 5 (fixed)<br>
          <b>Latency:</b> ~300ms (predictable)<br>
          <b>LLM calls:</b> 1 (predictable)<br>
          <b>Reliability:</b> HIGH<br>
          <b>Adaptability:</b> NONE<br><br>
          <span style="color:var(--pipe);font-size:.65rem">✅ Right choice for standard queries where execution path is known.</span>
        </div>
      </div>
    </div>
  `;
  const flow = document.getElementById('pipe-flow');
  PIPE_STEPS.forEach((s, i) => {
    if (i > 0) {
      const arr = document.createElement('div');
      arr.className = 'step-arrow';
      arr.id = `pa-${i}`;
      flow.appendChild(arr);
    }
    const el = document.createElement('div');
    el.className = 'step-node';
    el.id = `ps-${i}`;
    el.innerHTML = `<div class="sn-num">${s.num}</div><div class="sn-name">${s.name}</div><div class="sn-detail">${s.detail}</div>`;
    flow.appendChild(el);
    setTimeout(() => {
      el.classList.add('in', 'lit-pipe');
      if (i > 0) document.getElementById(`pa-${i}`)?.classList.add('lit-pipe');
    }, i * 200);
  });
}

// ── AGENT VIEW ─────────────────────────────────────────────────────────────
const AGENT_STEPS = [
  {tool:'query_pinot',       reason:'Start with user metrics for u_4821',                result:'5 errors, error_rate=80%, page=/checkout',                discovery:null},
  {tool:'search_vectors',    reason:'Errors found — get behavioral context',             result:'"payment gateway timeout", "checkout failing"',           discovery:null},
  {tool:'check_system_status',reason:'Vector context mentions gateway — check if systemic',result:'status=degraded, 847 errors, 23 users affected',       discovery:'🔍 DISCOVERY: Systemic outage! Not user-specific.'},
  {tool:'get_similar_cases', reason:'Gateway outage confirmed — find recovery strategy', result:'Historical: proactive outreach recovered 83% of users',   discovery:null},
];

function buildAgent() {
  const c = document.getElementById('view-agent');
  c.innerHTML = `
    <div style="font-size:.68rem;color:var(--dim);margin-bottom:14px">
      Task: "Why did user u_4821 churn?" — Agent adapts based on what it finds.
    </div>
    <div class="agent-steps" id="agent-steps"></div>
    <div class="result-grid" style="margin-top:16px">
      <div class="rbox">
        <div class="rbox-header agent">🤖 Agent Response</div>
        <div class="rbox-body agent-t">
          <b>Summary:</b> Root cause: payment gateway timeout (upstream provider). 23 users affected.<br>
          <b>Action:</b> proactive_outreach_all_affected_users<br>
          <b>Confidence:</b> 94%<br>
          <b>Scope:</b> systemic — 23 users, not just u_4821<br><br>
          <span style="color:var(--good);font-size:.65rem">✅ Discovered systemic issue. Correct root cause. Actionable at scale.</span>
        </div>
      </div>
      <div class="rbox">
        <div class="rbox-header agent" style="color:#94a3b8">📊 Agent Properties</div>
        <div class="rbox-body agent-t">
          <b>Steps:</b> 4 (adaptive — could be 2-8)<br>
          <b>Latency:</b> ~800ms (variable)<br>
          <b>LLM calls:</b> 5 (4 decisions + 1 answer)<br>
          <b>Reliability:</b> MEDIUM<br>
          <b>Adaptability:</b> HIGH<br><br>
          <span style="color:var(--agent);font-size:.65rem">✅ Right choice when execution path depends on intermediate results.</span>
        </div>
      </div>
    </div>
  `;
  const steps = document.getElementById('agent-steps');
  AGENT_STEPS.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'agent-step';
    el.innerHTML = `
      <div class="as-header">
        <span class="as-num">Step ${i+1}</span>
        <span class="as-tool">${s.tool}()</span>
      </div>
      <div class="as-reason">Reasoning: ${s.reason}</div>
      <div class="as-result">→ ${s.result}</div>
      ${s.discovery ? `<div class="as-discovery">${s.discovery}</div>` : ''}
    `;
    steps.appendChild(el);
    setTimeout(() => el.classList.add('in'), i * 250);
  });
}

// ── COMPARE VIEW ───────────────────────────────────────────────────────────
const CMP_ROWS = [
  ['Execution path',    'Fixed (hardcoded)',          'Adaptive (LLM decides)'],
  ['Steps taken',       '5 (always)',                 '2-8 (variable)'],
  ['Latency',           '~300ms (predictable)',       '~800ms (variable)'],
  ['LLM calls',         '1',                          '4-9'],
  ['Reliability',       'HIGH',                       'MEDIUM'],
  ['Discovered outage', '❌ No — not in the script',  '✅ Yes — dynamically queried'],
  ['Root cause',        '❌ Wrong (user-specific)',    '✅ Correct (systemic)'],
  ['Action',            '❌ Retention for 1 user',    '✅ Outreach for 23 users'],
  ['Best for',          'Standard, repeatable tasks', 'Investigation, root cause'],
];

const WHEN_ROWS = [
  ['Standard churn query',        '✅ Pipeline', 'Fixed path, predictable'],
  ['Root cause investigation',    '✅ Agent',    'Dynamic tool selection needed'],
  ['Embedding pipeline (10K/s)',  '✅ Pipeline', 'High throughput, no LLM overhead'],
  ['Multi-step user analysis',    '✅ Agent',    'Each step gates the next'],
  ['Weekly retention report',     '✅ Pipeline', 'Deterministic aggregation'],
  ['Systemic issue detection',    '✅ Agent',    'Unknown scope at query time'],
  ['Real-time fraud detection',   '✅ Pipeline', '< 200ms required'],
];

function buildCompare() {
  const c = document.getElementById('view-compare');
  c.innerHTML = `
    <table class="cmp-table">
      <thead><tr><th>Dimension</th><th style="color:var(--pipe)">🔄 Pipeline</th><th style="color:var(--agent)">🤖 Agent</th></tr></thead>
      <tbody>${CMP_ROWS.map(([d,p,a])=>`<tr><td>${d}</td><td class="pc">${p}</td><td class="ac">${a}</td></tr>`).join('')}</tbody>
    </table>
    <div style="margin-top:16px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">When to Use Each</div>
    <table class="cmp-table">
      <thead><tr><th>Scenario</th><th>Choice</th><th>Reason</th></tr></thead>
      <tbody>${WHEN_ROWS.map(([s,c,r])=>`<tr><td>${s}</td><td style="color:${c.includes('Pipeline')?'var(--pipe)':'var(--agent)'}">${c}</td><td style="color:var(--dim);font-size:.65rem">${r}</td></tr>`).join('')}</tbody>
    </table>
    <div style="margin-top:14px;padding:12px;border-radius:8px;border:1px solid rgba(34,197,94,.2);background:rgba(34,197,94,.04);font-size:.73rem;color:#3a7a5a;line-height:1.6">
      <b style="color:var(--good)">Rule:</b> Default to pipeline. Use agent only when the execution path genuinely needs to adapt based on intermediate results. Most data engineering tasks → pipeline.
    </div>
  `;
}

// ── SHOW ──────────────────────────────────────────────────────────────────
function show(type) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById(`view-${type}`).classList.add('on');
  document.querySelector(`.t-${type}`).classList.add('on');
  if(type==='pipe') buildPipeline();
  else if(type==='agent') buildAgent();
  else buildCompare();
}

show('compare');
</script>
</body>
</html>
