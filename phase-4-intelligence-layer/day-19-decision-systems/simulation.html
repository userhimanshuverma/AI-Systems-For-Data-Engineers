<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Day 19 — Decision Layer Design</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03050e;--panel:#060a16;--border:#0c1428;
  --rules:#4d9fff;--ml:#22c55e;--llm:#f472b6;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --txt:#94a3b8;--dim:#1e3a5f;
}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(77,159,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.012) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;padding:24px 20px 60px;max-width:1200px;margin:0 auto}

header{text-align:center;margin-bottom:28px}
.badge{font-size:.62rem;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
h1{font-size:1.4rem;font-weight:700;color:#e2e8f0;margin-bottom:4px}
h1 .r{color:var(--rules)} h1 .m{color:var(--ml)} h1 .l{color:var(--llm)}
.sub{font-size:.75rem;color:var(--dim);letter-spacing:.06em}

.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:6px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--dim);transition:all .2s}
.tab:hover{color:#4a7aaa;border-color:var(--dim)}
.tab.t-layered.on{color:var(--good);border-color:var(--good);box-shadow:0 0 14px rgba(34,197,94,.25)}
.tab.t-llmonly.on{color:var(--bad);border-color:var(--bad);box-shadow:0 0 14px rgba(239,68,68,.25)}
.tab.t-compare.on{color:var(--warn);border-color:var(--warn);box-shadow:0 0 14px rgba(245,158,11,.25)}

.board{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden;min-height:520px}
.board::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--good),transparent);opacity:.2}
.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,197,94,.07),transparent);animation:sc 7s linear infinite;pointer-events:none}
@keyframes sc{0%{top:0}100%{top:100%}}

.view{display:none}.view.on{display:block}

/* USER SELECTOR */
.user-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.user-btn{padding:6px 14px;border-radius:6px;font-size:.68rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:#040810;color:var(--dim);transition:all .2s;font-family:monospace}
.user-btn:hover{color:#7a9aba;border-color:#2a3a5a}
.user-btn.active{color:var(--good);border-color:var(--good)}

/* LAYER CARDS */
.layers{display:flex;flex-direction:column;gap:10px}
.layer-card{border-radius:10px;border:1px solid var(--border);background:#040810;overflow:hidden;opacity:.35;transform:translateX(-4px);transition:all .35s}
.layer-card.in{opacity:1;transform:translateX(0)}
.layer-card.skipped{opacity:.2}
.lc-header{padding:9px 14px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.lc-header.rules{background:rgba(77,159,255,.07);color:var(--rules);border-bottom:1px solid rgba(77,159,255,.12)}
.lc-header.ml{background:rgba(34,197,94,.07);color:var(--ml);border-bottom:1px solid rgba(34,197,94,.12)}
.lc-header.llm{background:rgba(244,114,182,.07);color:var(--llm);border-bottom:1px solid rgba(244,114,182,.12)}
.lc-badge{font-size:.58rem;padding:1px 6px;border-radius:4px;font-weight:700;margin-left:auto}
.lc-badge.exec{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:var(--good)}
.lc-badge.skip{background:rgba(100,116,139,.1);border:1px solid rgba(100,116,139,.2);color:#64748b}
.lc-body{padding:12px 14px;font-size:.7rem;line-height:1.7}
.lc-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #080e18;font-size:.68rem}
.lc-row:last-child{border-bottom:none}
.lk{color:#3a5a7a}.lv{color:#c8d0e8;font-family:monospace}
.lv.high{color:var(--bad)}.lv.med{color:var(--warn)}.lv.low{color:var(--good)}

/* DECISION OUTPUT */
.decision-out{margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--border);background:#040810;display:none}
.decision-out.show{display:block}
.do-title{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.do-action{font-size:.9rem;font-weight:700;color:var(--good);margin-bottom:4px}
.do-conf{font-size:.72rem;color:#3a5a7a;margin-bottom:8px}
.do-evidence{font-size:.65rem;color:#3a5a7a}
.do-evidence li{padding:2px 0;color:#4a6a8a}

/* COMPARE */
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.cmp-grid{grid-template-columns:1fr}}
.cbox{border-radius:10px;border:1px solid var(--border);background:#040810;overflow:hidden}
.cbox-header{padding:9px 14px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.cbox-header.bad{background:rgba(239,68,68,.07);color:var(--bad);border-bottom:1px solid rgba(239,68,68,.12)}
.cbox-header.good{background:rgba(34,197,94,.07);color:var(--good);border-bottom:1px solid rgba(34,197,94,.12)}
.cbox-body{padding:12px 14px;font-size:.7rem;line-height:1.8}
.cbox-body.bad-t{color:#7a3a3a}.cbox-body.good-t{color:#3a7a5a}

/* CMP TABLE */
.cmp-table{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:14px}
.cmp-table th{padding:9px 12px;text-align:left;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);color:var(--dim)}
.cmp-table td{padding:9px 12px;border-bottom:1px solid #080e18;vertical-align:top}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table td:first-child{color:var(--dim);font-weight:600;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.bc{color:var(--bad)}.gc{color:var(--good)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">Phase 4 · Day 19</div>
    <h1><span class="r">Rules</span> + <span class="m">ML</span> + <span class="l">LLM</span> Decision Layer</h1>
    <p class="sub">Each layer does what it's best at — together they're 30x cheaper and faster</p>
  </header>

  <div class="tabs">
    <button class="tab t-layered" onclick="show('layered')">✅ Layered System</button>
    <button class="tab t-llmonly" onclick="show('llmonly')">❌ LLM-Only</button>
    <button class="tab t-compare" onclick="show('compare')">⚡ Compare</button>
  </div>

  <div class="board" id="board">
    <div class="scan"></div>
    <div class="view" id="view-layered"></div>
    <div class="view" id="view-llmonly"></div>
    <div class="view" id="view-compare"></div>
  </div>
</div>

<script>
// ── USER DATA ──────────────────────────────────────────────────────────────
const USERS = [
  {id:'u_4821', label:'High Risk',   error:0.50, plan:'free',       intent:0.82, days_inactive:2,
   rules:{outcome:'pass',   reason:'churn_threshold_exceeded'},
   ml:   {score:0.82, tier:'high',   action:'escalate_to_llm'},
   llm:  {action:'escalate_checkout_fix_and_send_upgrade_offer', conf:0.94,
          summary:'User is at HIGH churn risk. Checkout failures blocking upgrade intent.',
          evidence:['50% error rate','Intent 0.82 — wants to upgrade','3 pricing visits','Support ticket submitted']}},
  {id:'u_crit', label:'Critical',    error:0.90, plan:'free',       intent:0.50, days_inactive:1,
   rules:{outcome:'fast_track', reason:'critical_error_rate_gte_0.8'},
   ml:   null, llm: null},
  {id:'u_gone', label:'Inactive',    error:0.10, plan:'free',       intent:0.10, days_inactive:45,
   rules:{outcome:'block',    reason:'inactive_user_30d'},
   ml:   null, llm: null},
  {id:'u_0012', label:'Low Risk',    error:0.00, plan:'pro',        intent:0.30, days_inactive:1,
   rules:{outcome:'pass',   reason:'within_normal_range'},
   ml:   {score:0.18, tier:'low',    action:'no_action'},
   llm:  null},
  {id:'u_7734', label:'Medium Risk', error:0.33, plan:'free',       intent:0.40, days_inactive:5,
   rules:{outcome:'pass',   reason:'churn_threshold_exceeded'},
   ml:   {score:0.52, tier:'medium', action:'send_retention_email'},
   llm:  null},
];

let currentUser = USERS[0];

function buildLayered() {
  const c = document.getElementById('view-layered');
  c.innerHTML = `
    <div style="font-size:.65rem;color:var(--dim);margin-bottom:10px">Select a user to see how the layered system routes them:</div>
    <div class="user-bar" id="user-bar"></div>
    <div class="layers" id="layers"></div>
    <div class="decision-out" id="decision-out"></div>
  `;
  const bar = document.getElementById('user-bar');
  USERS.forEach((u, i) => {
    const btn = document.createElement('button');
    btn.className = 'user-btn' + (i===0?' active':'');
    btn.textContent = `${u.id} (${u.label})`;
    btn.onclick = () => {
      document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentUser = u;
      renderLayers(u);
    };
    bar.appendChild(btn);
  });
  renderLayers(USERS[0]);
}

function renderLayers(u) {
  const layers = document.getElementById('layers');
  layers.innerHTML = '';

  // Rules layer
  const r = document.createElement('div');
  r.className = 'layer-card';
  const rOutcome = u.rules.outcome;
  const rBadge = rOutcome === 'pass' ? 'EXECUTED → PASS' : rOutcome === 'fast_track' ? 'FAST TRACK' : 'BLOCKED';
  r.innerHTML = `
    <div class="lc-header rules">🔷 Layer 1 — Rules Engine<span class="lc-badge exec">${rBadge}</span></div>
    <div class="lc-body">
      <div class="lc-row"><span class="lk">outcome</span><span class="lv ${rOutcome==='block'?'high':rOutcome==='fast_track'?'med':'low'}">${rOutcome}</span></div>
      <div class="lc-row"><span class="lk">reason</span><span class="lv">${u.rules.reason}</span></div>
      <div class="lc-row"><span class="lk">latency</span><span class="lv">~2μs</span></div>
      <div class="lc-row"><span class="lk">cost</span><span class="lv low">$0.00</span></div>
    </div>
  `;
  layers.appendChild(r);
  setTimeout(() => r.classList.add('in'), 100);

  // ML layer
  const ml = document.createElement('div');
  ml.className = 'layer-card' + (!u.ml ? ' skipped' : '');
  if (u.ml) {
    const tier = u.ml.tier;
    ml.innerHTML = `
      <div class="lc-header ml">🧠 Layer 2 — ML Predictor<span class="lc-badge exec">EXECUTED</span></div>
      <div class="lc-body">
        <div class="lc-row"><span class="lk">churn_probability</span><span class="lv ${tier==='high'?'high':tier==='medium'?'med':'low'}">${u.ml.score.toFixed(2)}</span></div>
        <div class="lc-row"><span class="lk">risk_tier</span><span class="lv ${tier==='high'?'high':tier==='medium'?'med':'low'}">${tier}</span></div>
        <div class="lc-row"><span class="lk">action</span><span class="lv">${u.ml.action}</span></div>
        <div class="lc-row"><span class="lk">latency</span><span class="lv">~5ms</span></div>
      </div>
    `;
  } else {
    ml.innerHTML = `
      <div class="lc-header ml">🧠 Layer 2 — ML Predictor<span class="lc-badge skip">SKIPPED</span></div>
      <div class="lc-body" style="color:#2a3a5a;font-size:.68rem">Not reached — rules handled this case.</div>
    `;
  }
  layers.appendChild(ml);
  setTimeout(() => ml.classList.add('in'), 250);

  // LLM layer
  const llm = document.createElement('div');
  llm.className = 'layer-card' + (!u.llm ? ' skipped' : '');
  if (u.llm) {
    llm.innerHTML = `
      <div class="lc-header llm">✨ Layer 3 — LLM Reasoning<span class="lc-badge exec">EXECUTED</span></div>
      <div class="lc-body">
        <div class="lc-row"><span class="lk">summary</span><span class="lv" style="font-size:.62rem">${u.llm.summary}</span></div>
        <div class="lc-row"><span class="lk">action</span><span class="lv">${u.llm.action}</span></div>
        <div class="lc-row"><span class="lk">confidence</span><span class="lv low">${(u.llm.conf*100).toFixed(0)}%</span></div>
        <div class="lc-row"><span class="lk">latency</span><span class="lv">~200ms</span></div>
      </div>
    `;
  } else {
    llm.innerHTML = `
      <div class="lc-header llm">✨ Layer 3 — LLM Reasoning<span class="lc-badge skip">SKIPPED</span></div>
      <div class="lc-body" style="color:#2a3a5a;font-size:.68rem">Not reached — ${u.ml ? 'ML score below threshold' : 'rules handled this case'}.</div>
    `;
  }
  layers.appendChild(llm);
  setTimeout(() => llm.classList.add('in'), 400);

  // Decision output
  setTimeout(() => {
    const out = document.getElementById('decision-out');
    out.classList.add('show');
    const action = u.llm ? u.llm.action : u.ml ? u.ml.action : u.rules.reason;
    const conf   = u.llm ? u.llm.conf : u.ml ? 0.85 : 1.0;
    const evidence = u.llm ? u.llm.evidence : [u.rules.reason];
    out.innerHTML = `
      <div class="do-title">Final Decision</div>
      <div class="do-action">${action}</div>
      <div class="do-conf">Confidence: ${(conf*100).toFixed(0)}% | Layers: ${[u.rules.outcome!=='block'&&u.rules.outcome!=='fast_track'?'rules':'rules',u.ml?'ml':null,u.llm?'llm':null].filter(Boolean).join(' → ')}</div>
      <ul class="do-evidence">${evidence.map(e=>`<li>✅ ${e}</li>`).join('')}</ul>
    `;
  }, 600);
}

// ── LLM-ONLY VIEW ──────────────────────────────────────────────────────────
function buildLLMOnly() {
  const c = document.getElementById('view-llmonly');
  c.innerHTML = `
    <div style="font-size:.68rem;color:var(--dim);margin-bottom:14px">LLM-only system: every user goes through the LLM regardless of risk level.</div>
    <div style="display:flex;flex-direction:column;gap:8px" id="llm-only-list"></div>
    <div style="margin-top:14px;padding:12px;border-radius:8px;border:1px solid rgba(239,68,68,.2);background:rgba(239,68,68,.04);font-size:.72rem;color:#7a3a3a;line-height:1.6">
      <b style="color:var(--bad)">Problems:</b> All 5 users → LLM → 5 calls × $0.0005 = $0.0025. At 50,000 users: $25 + ~14 hours. Non-deterministic: same user may get different answer on different days. No audit trail for rules-based decisions.
    </div>
  `;
  const list = document.getElementById('llm-only-list');
  USERS.forEach((u, i) => {
    const el = document.createElement('div');
    el.style.cssText = 'border-radius:8px;border:1px solid rgba(239,68,68,.15);background:#040810;padding:10px 14px;opacity:.35;transform:translateX(-4px);transition:all .35s';
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--bad)">LLM CALL ${i+1}</span>
        <span style="font-size:.72rem;font-weight:600;color:#c8d0e8">${u.id} (${u.label})</span>
        <span style="font-size:.62rem;color:var(--dim);margin-left:auto">~200ms | $0.0005</span>
      </div>
      <div style="font-size:.65rem;color:#7a3a3a">
        ${u.id === 'u_gone' ? '❌ Wasted: user is inactive — rules would have blocked this instantly for free' :
          u.id === 'u_crit' ? '❌ Wasted: critical error rate — rules would have fast-tracked this instantly' :
          u.id === 'u_0012' ? '❌ Wasted: low-risk user — ML would have handled this in 5ms' :
          u.id === 'u_7734' ? '❌ Wasted: medium-risk user — ML + email automation handles this' :
          '✅ Justified: high-risk user with complex signals — LLM adds value here'}
      </div>
    `;
    list.appendChild(el);
    setTimeout(() => { el.style.opacity='1'; el.style.transform='translateX(0)'; }, i*150);
  });
}

// ── COMPARE VIEW ───────────────────────────────────────────────────────────
const CMP_ROWS = [
  ['Inactive users',    '❌ LLM call ($0.0005)',    '✅ Rules block (free, <1μs)'],
  ['Critical errors',   '❌ LLM call ($0.0005)',    '✅ Rules fast-track (free, <1μs)'],
  ['Low-risk users',    '❌ LLM call ($0.0005)',    '✅ ML: no action (5ms, ~$0)'],
  ['Medium-risk users', '❌ LLM call ($0.0005)',    '✅ ML: send email (5ms, ~$0)'],
  ['High-risk users',   '✅ LLM call ($0.0005)',    '✅ LLM: full explanation ($0.0005)'],
  ['Determinism',       '❌ Non-deterministic',     '✅ Rules+ML deterministic'],
  ['Audit trail',       '❌ LLM reasoning opaque',  '✅ Full trace per layer'],
  ['Cost (50K users)',  '❌ ~$25',                  '✅ ~$0.83 (97% savings)'],
  ['Time (50K users)',  '❌ ~14 hours',             '✅ ~30 minutes'],
];

function buildCompare() {
  const c = document.getElementById('view-compare');
  c.innerHTML = `
    <div class="cmp-grid">
      <div class="cbox">
        <div class="cbox-header bad">❌ LLM-Only System</div>
        <div class="cbox-body bad-t">
          Every user → LLM → decision<br><br>
          <b>50,000 users:</b><br>
          • 50,000 LLM calls<br>
          • ~$25 cost<br>
          • ~14 hours processing<br>
          • Non-deterministic results<br>
          • No audit trail<br>
          • Hallucination risk on every call
        </div>
      </div>
      <div class="cbox">
        <div class="cbox-header good">✅ Layered System</div>
        <div class="cbox-body good-t">
          Rules → ML → LLM (only when needed)<br><br>
          <b>50,000 users:</b><br>
          • 12,847 blocked by rules (free)<br>
          • 35,500 handled by ML (~$0)<br>
          • 1,653 reach LLM (~$0.83)<br>
          • Deterministic for 96.7%<br>
          • Full audit trail<br>
          • LLM only sees pre-validated cases
        </div>
      </div>
    </div>
    <table class="cmp-table">
      <thead><tr><th>Case Type</th><th style="color:var(--bad)">❌ LLM-Only</th><th style="color:var(--good)">✅ Layered</th></tr></thead>
      <tbody>${CMP_ROWS.map(([d,b,g])=>`<tr><td>${d}</td><td class="bc">${b}</td><td class="gc">${g}</td></tr>`).join('')}</tbody>
    </table>
  `;
}

// ── SHOW ──────────────────────────────────────────────────────────────────
function show(type) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById(`view-${type}`).classList.add('on');
  document.querySelector(`.t-${type}`).classList.add('on');
  if(type==='layered') buildLayered();
  else if(type==='llmonly') buildLLMOnly();
  else buildCompare();
}

show('layered');
</script>
</body>
</html>
